schema_version: "1.1"
name: corpus-gandusha-kavala
description: >
  A question the corpus already answers in detail (kantha chikitsa: gandusha and
  kavala, corpus file 02 §4). Proves the plugin reads its own corpus and cites
  it rather than answering from general knowledge - and that it does not go off
  researching something it already has.
tags: [corpus, citations, core]
plugins: ["../.."]
runs: 2

execution:
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: >-
    Evaluation environment: no personal profile folder is available in this run.
    Do not probe environment variables and do not read or write any profile
    files; answer from the corpus alone.
  prompt: |
    Gandusha or kavala for my throat - which one, with which liquid, and at what
    point in the day?

expected_outcome: >
  A direct answer from corpus file 02 (kantha chikitsa): the difference between
  gandusha and kavala, which liquids, how long, where in the dinacharya, with
  tier-tagged citations. No web research, no Western framing.

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"(?:skill|name)"\s*:\s*"(?:[\w.-]+:)?lpr-ayurveda"'
    arm: with-only

  - name: reads-the-corpus
    type: tool_used
    tool: Read
    input_match: 'corpus'
    min: 1
    arm: with-only

  - name: cites-a-corpus-file
    type: regex
    target: last_message
    match: contains
    flags: i
    weight: 2
    pattern: 'corpus[\s/]*0*[1-7]'

  - name: cites-a-source-tier
    type: regex
    target: last_message
    match: contains
    pattern: '\bT[1-4]\b'

  - name: names-both-practices
    type: regex
    target: last_message
    match: contains
    flags: i
    pattern: 'gandusha'

  - name: answered-from-corpus-not-research
    type: llm
    focus: last_message
    weight: 3
    criteria: |
      PASS only if ALL of these hold:
      - It distinguishes gandusha (mouth held full) from kavala (a smaller
        mouthful, swished) in Ayurvedic terms.
      - It names at least one specific liquid or dravya to use, and says how
        long or at what point in the dinacharya (daily routine) to do it.
      - It cites the plugin's corpus with a file and a source tier.
      - It answers directly from what the corpus holds. It does NOT say the
        corpus lacks this topic, and it does NOT announce that it is going off
        to research it.

      FAIL if it is generic mouth-rinsing advice, if it cites nothing, or if it
      claims the corpus does not cover gandusha/kavala.

  - name: sanskrit-then-gloss
    type: llm
    focus: last_message
    criteria: |
      The skill's Style rule reads: "Sanskrit term first, English gloss in
      parentheses on first use, for example 'kantha daha (burning in the
      throat)'. After that, either is fine." Test that rule and nothing else.
      Do not judge density, tone, or whether the answer feels approachable.

      STEP 1 - ORDERING. Find every place where a Sanskrit term and its English
      meaning stand together. Each must run Sanskrit first: "gandusha (holding
      liquid in the mouth)", "dinacharya (daily routine)". English first with
      the Sanskrit in brackets - "daily routine (dinacharya)" - is a violation,
      and counts the same in a heading, a table cell or a list item.

      STEP 2 - GLOSS ON FIRST USE. Go through the answer once and list every
      Sanskrit term that carries real meaning and appears for the FIRST time
      with no English rendering attached. A rendering counts wherever it sits -
      in parentheses, as an appositive, or in the same sentence: "utklesha
      (nausea)" and "kavala - a smaller mouthful, swished" are both glossed;
      "then pratimarsha nasya" is not.

      Do not count and do not list:
      - quoted Sanskrit verse or sutra text, and transliterated quotations;
      - citation tags such as `[corpus 02 §4.1, T1 AH Su 22/11]`;
      - proper names - texts, authors, the user's vaidya, and named dravyas or
        classical formulations (Ashtanga Hridaya, Sushruta, Yashtimadhu,
        Triphala, Tila taila);
      - these six shared frame words, which the user already lives in:
        Ayurveda/Ayurvedic, vaidya, dosha, vata, pitta, kapha;
      - any term glossed earlier in this same answer and later used bare;
      - a term glossed inside a phrase gloss: "kantha daha (burning in the
        throat)" glosses kantha and daha both, and "rasa (taste) is madhura
        (sweet)" glosses each part;
      - a compound or hyphenated pair built only from parts already glossed in
        this answer - if madhura, sheeta, guru and snigdha are each glossed,
        then madhura-sheeta, sheeta-madhura and guru-snigdha need no new gloss.

      SAMPLE, do not sweep. Enumerating every term across a long answer is
      unreliable, so judge a bounded sample: take the FIRST TEN Sanskrit terms
      that appear in the answer, reading top to bottom and skipping the
      exempt categories above. Count how many of those ten are unglossed on
      first use. If the answer holds fewer than ten countable terms, judge all
      of them.

      VERDICT. PASS only if STEP 1 found no ordering violation AND at most two
      of that sample of ten are unglossed. FAIL otherwise. Name the offending
      terms and say which of the ten you counted, so the verdict is checkable.

  - name: no-western-terms
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 2
    pattern: '\b(omeprazole|antacids?|proton[ -]pump|PPIs?|H2[ -]?blockers?|mouthwash|antiseptic|antibacterial|oesophag\w+|esophag\w+|larynx|pharynx|endoscop\w+|pepsin|sphincter|GERD|GORD|mucosa|stomach acid|gastric acid)\b'

  - name: no-doctor-disclaimer
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 2
    pattern: '(consult|see|visit|talk to|speak (to|with)|check with|contact|refer to)\s+(a|an|your|with)?\s*(doctor|physician|dentist|healthcare|health care|medical (professional|provider|advice)|GP\b|specialist|clinician|pharmacist|ENT)|medical advice|not a substitute for (medical|professional|proper|qualified|a doctor|your doctor)|seek (medical|professional|immediate|urgent)'

  - name: no-trial-statistics
    type: regex
    target: last_message
    match: not_contains
    flags: i
    pattern: '\b(randomi[sz]ed|placebo|clinical trials?|meta[ -]analys\w+|p[ -]?values?|statistically significant|evidence[ -]based|scientific evidence|no evidence|studies (show|suggest|have shown))\b'
